</style></head> <body data-topics-url="/data/knowledge/releases/525dfb099b4bb5d4c4b7ccf81f890f52701fcd6dd02c336004fdc9d91db73825/topics.json" data-astro-cid-n7tr52od> <main data-astro-cid-n7tr52od> <p data-astro-cid-n7tr52od><a href="/" data-astro-cid-n7tr52od>返回首页</a> · <a href="/explore/" data-astro-cid-n7tr52od>主题探索</a> · <a href="/tools/" data-astro-cid-n7tr52od>工具</a> · <a href="/knowledge-data/" data-astro-cid-n7tr52od>查看 site-data</a></p> <h1 data-astro-cid-n7tr52od>主题展厅</h1> <p class="lede" data-astro-cid-n7tr52od>集合、成员与关系均由 Astro 从版本化 site-data 预渲染；浏览器只读取 <code data-astro-cid-n7tr52od>topics.json</code>，不接触私有源结构。</p> <p class="muted" data-astro-cid-n7tr52od>1 个集合 · 2 个成员</p> <ul class="cards" id="topic-gallery" data-astro-cid-n7tr52od> <li class="card" id="topic-site.hybrid-indexing.collection" data-astro-cid-n7tr52od> <span class="kind" data-astro-cid-n7tr52od>collection</span> <h2 data-astro-cid-n7tr52od>混合索引实践集合</h2> <p class="muted" data-astro-cid-n7tr52od>2 个成员 · 更新于 2026-08-02</p> <ul class="members" data-astro-cid-n7tr52od> <li data-astro-cid-n7tr52od><a href="/explore/#topic-site.hybrid-indexing.article" data-astro-cid-n7tr52od>混合索引如何让主题关系保持可读</a> <span class="kind" data-astro-cid-n7tr52od>article</span></li><li data-astro-cid-n7tr52od><a href="/explore/#topic-site.hybrid-indexing.entity" data-astro-cid-n7tr52od>混合索引</a> <span class="kind" data-astro-cid-n7tr52od>entity</span></li> </ul> <ul class="relations" aria-label="关系" data-astro-cid-n7tr52od> <li class="relation" title="site.hybrid-indexing.article → site.hybrid-indexing.entity" data-astro-cid-n7tr52od>explains</li><li class="relation" title="site.hybrid-indexing.entity → site.hybrid-indexing.article" data-astro-cid-n7tr52od>illustrated-by</li> </ul> </li> </ul> <p id="status" class="status" role="status" data-astro-cid-n7tr52od>以上内容来自当前版本化发布包。</p> <noscript><p class="muted" data-astro-cid-n7tr52od>JavaScript 已禁用；上方主题列表仍可阅读。页面不会请求在线来源。</p></noscript> </main> <script type="module">
      const status = document.querySelector('#status')
      const gallery = document.querySelector('#topic-gallery')
      const url = document.body.dataset.topicsUrl
      const renderCollection = (collection) => {
        const item = document.createElement('li'); item.className = 'card'; item.id = `topic-${collection.id}`
        const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = collection.kind
        const heading = document.createElement('h2'); heading.textContent = collection.title
        const meta = document.createElement('p'); meta.className = 'muted'; meta.textContent = `${collection.members.length} 个成员 · 更新于 ${collection.updatedAt}`
        const members = document.createElement('ul'); members.className = 'members'
        for (const member of collection.members) {
          const entry = document.createElement('li')
          const link = document.createElement('a'); link.href = `/explore/#topic-${member.id}`; link.textContent = member.title
          const memberKind = document.createElement('span'); memberKind.className = 'kind'; memberKind.textContent = member.kind
          entry.append(link, ' ', memberKind); members.append(entry)
        }
        const relations = document.createElement('ul'); relations.className = 'relations'
        for (const edge of collection.relations ?? []) {
          const chip = document.createElement('li'); chip.className = 'relation'; chip.title = `${edge.from} → ${edge.to}`; chip.textContent = edge.type
          relations.append(chip)
        }
        item.append(kind, heading, meta, members)
        if (relations.children.length) item.append(relations)
        return item
      }
      if (url && gallery) {
        try {
          const response = await fetch(url, { cache: 'force-cache' })
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          const payload = await response.json()
          const fresh = payload.collections
          if (Array.isArray(fresh) && fresh.length) {
            gallery.replaceChildren(...fresh.map(renderCollection))
            status.textContent = `已从版本化 JSON 更新 ${fresh.length} 个集合；未访问私有源。`
          }
        } catch (error) {
          status.classList.add('error')
          status.textContent = `版本化主题数据请求失败，保留预渲染内容：${error.message}`
        }
      }
    </script> </body> </html>
