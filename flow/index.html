</style></head> <body data-flow-url="/data/knowledge/releases/3a8dd0577fd45ed0816045c3b0f3a08fe4741954c10d67811e3924d0f756dbf4/content-records.json" data-astro-cid-d4ajy5an> <div id="flow-progress" aria-hidden="true" data-astro-cid-d4ajy5an></div> <main data-astro-cid-d4ajy5an> <p data-astro-cid-d4ajy5an><a href="/" data-astro-cid-d4ajy5an>返回首页</a> · <a href="/explore/" data-astro-cid-d4ajy5an>主题探索</a></p> <h1 data-astro-cid-d4ajy5an>文字流</h1> <p class="lede" data-astro-cid-d4ajy5an>文章与札记按发布时间连成一条连续阅读流；正文由 Astro 预渲染，进度条只是增强。</p> <p class="muted" data-astro-cid-d4ajy5an>2 篇 · 来自版本化内容记录</p> <article id="flow-site.hybrid-indexing.article" data-astro-cid-d4ajy5an> <h2 data-astro-cid-d4ajy5an><a href="/explore/#topic-site.hybrid-indexing.article" data-astro-cid-d4ajy5an>混合索引如何让主题关系保持可读</a></h2> <p class="meta muted" data-astro-cid-d4ajy5an>article · 2026-08-02</p> <p data-astro-cid-d4ajy5an>混合索引把对象、列表、关系和时间线拆成适合各自访问形态的静态分片；详情页仍由 Astro 预渲染，探索页只读取当前需要的索引。</p> </article><article id="flow-site.examples.contract-introduction" data-astro-cid-d4ajy5an> <h2 data-astro-cid-d4ajy5an><a href="/explore/#topic-site.examples.contract-introduction" data-astro-cid-d4ajy5an>知识站内容契约示例</a></h2> <p class="meta muted" data-astro-cid-d4ajy5an>note · 2026-08-01</p> <p data-astro-cid-d4ajy5an>这是 S0 使用的结构化内容示例；旧博客内容暂不迁移。</p> </article> <p id="status" class="status" role="status" data-astro-cid-d4ajy5an>以上内容来自当前版本化发布包。</p> <noscript><p class="muted" data-astro-cid-d4ajy5an>JavaScript 已禁用；上方文字流仍可完整阅读，仅阅读进度条不可用。</p></noscript> </main> <script type="module">
      const progress = document.querySelector('#flow-progress')
      const status = document.querySelector('#status')
      const updateProgress = () => {
        if (!progress) return
        const scrollable = document.documentElement.scrollHeight - window.innerHeight
        progress.style.width = `${scrollable > 0 ? Math.min(100, (window.scrollY / scrollable) * 100) : 0}%`
      }
      window.addEventListener('scroll', updateProgress, { passive: true })
      updateProgress()
      const url = document.body.dataset.flowUrl
      if (url && status) {
        try {
          const response = await fetch(url, { cache: 'force-cache' })
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          const payload = await response.json()
          const fresh = Array.isArray(payload.records) ? payload.records.filter((record) => record.status !== 'archived' && ['article', 'note'].includes(record.kind) && typeof record.body === 'string') : []
          status.textContent = `已确认版本化内容记录（${fresh.length} 篇正文）；正文为预渲染 HTML。`
        } catch (error) {
          status.classList.add('error')
          status.textContent = `版本化内容记录请求失败，保留预渲染正文：${error.message}`
        }
      }
    </script> </body> </html>
